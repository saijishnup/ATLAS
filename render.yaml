# Render blueprint: backend only (frontend goes to Vercel, see README "Hosted deploy").
services:
  - type: web
    name: atlas-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION   # tomllib needs >= 3.11
        value: 3.12.7
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: qwen/qwen3.8-27b
      - key: LLM_API_KEY
        sync: false            # set in the Render dashboard, never in the repo
      - key: CORS_ORIGINS
        sync: false            # e.g. https://atlas-xyz.vercel.app
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DAILY_LLM_CAP
        value: "300"
